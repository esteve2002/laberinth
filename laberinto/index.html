<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laberinto</title>
  <link rel="stylesheet" href="style.css">
  <style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Infant:wght@400;600;700&family=Great+Vibes&display=swap');
  </style>
</head>
<body>
  <main class="app">
    <header class="hero">
      <p class="eyebrow">Aventura romántica</p>
      <h1 class="title">El laberinto del amor</h1>
      <p class="subtitle">Míralo desde arriba, abre cartas y supera cada nivel.</p>
    </header>

    <section class="stage">
      <div class="hud" aria-live="polite">
        <div class="hud-chip">Nivel <strong id="nivelActual">1</strong></div>
        <div class="hud-chip">Cartas <strong id="cartasRestantes">0</strong></div>
        <div class="hud-chip">Estado <strong id="estadoPartida">Explorando</strong></div>
      </div>

      <p class="mensaje" id="mensaje"></p>

      <div class="tablero">
        <canvas id="laberinto"></canvas>
      </div>

      <div class="controls" aria-hidden="true">
        <span>← ↑ → ↓ / WASD para moverte</span>
        <span>Enter o Espacio para abrir cartas</span>
        <span>Esc para cerrar</span>
      </div>
    </section>

    <p class="firma">by Esteve Riba</p>
  </main>

  <div class="card-modal" id="cardModal" role="dialog" aria-modal="true" aria-labelledby="cardTitle">
    <div class="card-shell">
      <p class="card-kicker" id="cardKicker">Carta del camino</p>
      <h2 id="cardTitle"></h2>
      <p id="cardText"></p>
      <button id="cardAction" class="card-button" type="button">Seguir</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
